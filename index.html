<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LATTICCE</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --fg: #fff;
      --muted: rgba(255,255,255,0.54);
      --line: rgba(255,255,255,0.16);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      isolation: isolate;
    }

    .stage {
      position: relative;
      z-index: 2;
      display: grid;
      place-items: center;
      width: min(92vw, 1100px);
      height: 42vh;
    }

    h1 {
      margin: 0;
      cursor: crosshair;
      user-select: none;
      color: #fff;
      font-size: clamp(4rem, 16vw, 13rem);
      font-weight: 900;
      line-height: 0.86;
      letter-spacing: clamp(0.08em, 1vw, 0.18em);
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255,255,255,0.18), 0 0 48px rgba(255,255,255,0.10);
      transition: opacity 220ms ease, filter 220ms ease, transform 220ms ease;
    }

    h1.is-hidden {
      opacity: 0;
      filter: blur(14px);
      transform: scale(0.98);
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .hint,
    .scroll-callout {
      position: fixed;
      z-index: 3;
      color: rgba(255,255,255,0.45);
      font-size: 0.78rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      pointer-events: none;
    }

    .hint {
      left: 50%;
      bottom: 2rem;
      transform: translateX(-50%);
      transition: opacity 220ms ease;
    }

    body.exploded .hint {
      opacity: 0;
    }

    .scroll-callout {
      left: 50%;
      top: 72%;
      opacity: 0;
      color: rgba(255,255,255,0.34);
      text-shadow: 0 0 18px rgba(255,255,255,0.18);
      transform: translate(-50%, -50%);
      transition: opacity 500ms ease, left 500ms ease, top 500ms ease;
      white-space: nowrap;
    }

    .scroll-callout.is-visible {
      opacity: 1;
    }

    .contact {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(4rem, 10vw, 8rem) 1.25rem;
      background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.08), transparent 36%), #000;
      border-top: 1px solid var(--line);
    }

    .contact-card {
      width: min(100%, 720px);
      padding: clamp(1.5rem, 5vw, 3rem);
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255,255,255,0.035);
      box-shadow: 0 30px 100px rgba(255,255,255,0.05);
      backdrop-filter: blur(18px);
    }

    .contact-eyebrow {
      margin: 0 0 0.85rem;
      color: var(--muted);
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h2 {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 7vw, 4.75rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .contact-copy {
      max-width: 46rem;
      margin: 0 0 2rem;
      color: rgba(255,255,255,0.68);
      font-size: clamp(1rem, 2vw, 1.12rem);
      line-height: 1.65;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: 0.45rem;
      color: rgba(255,255,255,0.76);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(0,0,0,0.56);
      color: #fff;
      padding: 1rem 1.05rem;
      font: inherit;
      outline: none;
      transition: border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: rgba(255,255,255,0.58);
      background: rgba(0,0,0,0.78);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.08);
    }

    button {
      justify-self: start;
      border: 1px solid rgba(255,255,255,0.72);
      border-radius: 999px;
      background: #fff;
      color: #000;
      padding: 0.95rem 1.4rem;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 60px rgba(255,255,255,0.18);
    }
  </style>
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>

  <section class="hero" aria-label="LATTICCE hero">
    <main class="stage">
      <h1 id="title" tabindex="0">LATTICCE</h1>
    </main>

    <div class="hint">hover sobre el título</div>
    <div class="scroll-callout" id="scrollCallout">Desliza hacia abajo</div>
  </section>

  <section class="contact" id="contacto" aria-labelledby="contact-title">
    <div class="contact-card">
      <p class="contact-eyebrow">Contacto</p>
      <h2 id="contact-title">Hablemos de tu siguiente sitio.</h2>
      <p class="contact-copy">Cuéntanos qué quieres construir. Este formulario está listo como interfaz visual y puede conectarse después a email, WhatsApp, CRM o backend.</p>

      <form>
        <label>
          Nombre
          <input type="text" name="name" autocomplete="name" placeholder="Tu nombre" />
        </label>

        <label>
          Email
          <input type="email" name="email" autocomplete="email" placeholder="tu@email.com" />
        </label>

        <label>
          Mensaje
          <textarea name="message" placeholder="Cuéntanos sobre el proyecto"></textarea>
        </label>

        <button type="submit">Enviar mensaje</button>
      </form>
    </div>
  </section>

  <script>
    const canvas = document.querySelector('#particles');
    const ctx = canvas.getContext('2d');
    const title = document.querySelector('#title');
    const scrollCallout = document.querySelector('#scrollCallout');
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    let particles = [];
    let animationFrame = null;
    let calloutTimer = null;
    let exploded = false;

    function resize() {
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function moveCallout() {
      const x = 14 + Math.random() * 72;
      const y = 18 + Math.random() * 64;
      scrollCallout.style.left = `${x}%`;
      scrollCallout.style.top = `${y}%`;
      scrollCallout.classList.add('is-visible');
    }

    function startCallout() {
      moveCallout();
      clearInterval(calloutTimer);
      calloutTimer = setInterval(moveCallout, 3000);
    }

    function stopCallout() {
      clearInterval(calloutTimer);
      calloutTimer = null;
      scrollCallout.classList.remove('is-visible');
    }

    function makeTextParticles() {
      const rect = title.getBoundingClientRect();
      const offscreen = document.createElement('canvas');
      const octx = offscreen.getContext('2d', { willReadFrequently: true });
      const width = Math.ceil(rect.width + 80);
      const height = Math.ceil(rect.height + 80);
      const styles = getComputedStyle(title);

      offscreen.width = width;
      offscreen.height = height;
      octx.fillStyle = '#fff';
      octx.textAlign = 'center';
      octx.textBaseline = 'middle';
      octx.font = `${styles.fontWeight} ${styles.fontSize} ${styles.fontFamily}`;
      octx.fillText(title.textContent, width / 2, height / 2);

      const data = octx.getImageData(0, 0, width, height).data;
      const gap = Math.max(4, Math.floor(window.innerWidth / 230));
      const startX = rect.left - 40;
      const startY = rect.top - 40;
      const next = [];

      for (let y = 0; y < height; y += gap) {
        for (let x = 0; x < width; x += gap) {
          const alpha = data[(y * width + x) * 4 + 3];
          if (alpha > 90) {
            const originX = startX + x;
            const originY = startY + y;
            const angle = Math.random() * Math.PI * 2;
            const targetPadding = 42;
            const floatSpeed = 0.012 + Math.random() * 0.028;

            next.push({
              x: originX,
              y: originY,
              ox: originX,
              oy: originY,
              tx: targetPadding + Math.random() * (window.innerWidth - targetPadding * 2),
              ty: targetPadding + Math.random() * (window.innerHeight - targetPadding * 2),
              vx: Math.cos(angle) * (2.5 + Math.random() * 8),
              vy: Math.sin(angle) * (2.5 + Math.random() * 8),
              size: Math.random() * 2.8 + 1.1,
              alpha: 1,
              spin: Math.random() * Math.PI,
              life: 0,
              orbit: Math.random() * Math.PI * 2,
              floatSpeed,
              drift: 10 + Math.random() * 34
            });
          }
        }
      }

      particles = next;
    }

    function explode() {
      if (exploded) return;
      exploded = true;
      document.body.classList.add('exploded');
      title.classList.add('is-hidden');
      makeTextParticles();
      startCallout();
      animate();
    }

    function restore() {
      exploded = false;
      document.body.classList.remove('exploded');
      title.classList.remove('is-hidden');
      stopCallout();
    }

    function animate() {
      cancelAnimationFrame(animationFrame);
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      particles = particles.filter((p) => {
        p.life += 1;

        if (exploded) {
          p.orbit += p.floatSpeed;
          const floatX = Math.cos(p.orbit * 2.1) * p.drift;
          const floatY = Math.sin(p.orbit * 1.6) * p.drift;
          const destinationX = p.tx + floatX;
          const destinationY = p.ty + floatY;

          p.vx += (destinationX - p.x) * 0.0045;
          p.vy += (destinationY - p.y) * 0.0045;
          p.vx *= 0.91;
          p.vy *= 0.91;
          p.x += p.vx;
          p.y += p.vy;
          p.alpha = 0.72 + Math.sin(p.orbit * 3) * 0.22;
        } else {
          p.x += (p.ox - p.x) * 0.16;
          p.y += (p.oy - p.y) * 0.16;
          p.alpha *= 0.94;
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.spin + p.life * 0.08);
        ctx.fillStyle = `rgba(255,255,255,${p.alpha})`;
        ctx.shadowColor = 'rgba(255,255,255,0.85)';
        ctx.shadowBlur = 14;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();

        return exploded || p.alpha > 0.02;
      });

      if (particles.length) {
        animationFrame = requestAnimationFrame(animate);
      } else {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }
    }

    title.addEventListener('mouseenter', explode);
    title.addEventListener('focus', explode);
    title.addEventListener('mouseleave', restore);
    title.addEventListener('blur', restore);
    title.addEventListener('touchstart', (event) => {
      event.preventDefault();
      explode();
      window.setTimeout(restore, 3000);
    }, { passive: false });

    window.addEventListener('resize', () => {
      resize();
      if (exploded) makeTextParticles();
    });

    document.querySelector('form').addEventListener('submit', (event) => {
      event.preventDefault();
    });

    resize();
  </script>
</body>
</html>
