<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inicio de sesión exitoso — LATTICCE</title>
  <style>
    :root {
      color-scheme: dark;
      --fg: #f7f7f7;
      --muted: rgba(255,255,255,.62);
      --line: rgba(255,255,255,.18);
      --cyan: #90fff4;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; background: #000; }

    body {
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--fg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 50% 24%, rgba(255,255,255,.13), transparent 22rem),
        radial-gradient(circle at 30% 72%, rgba(144,255,244,.07), transparent 20rem),
        #000;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(255,255,255,.75) 0 1px, transparent 1.5px);
      background-size: 140px 140px;
      opacity: .2;
      animation: starDrift 48s linear infinite;
    }

    body::after {
      opacity: .12;
      background-size: 280px 280px;
      animation-direction: reverse;
      animation-duration: 80s;
    }

    #space-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: .7;
      mix-blend-mode: screen;
    }

    @keyframes starDrift { from { transform: translate3d(0,0,0) rotate(0deg); } to { transform: translate3d(-7%, 9%, 0) rotate(2deg); } }
    @keyframes orbitalSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulseGlow { 0%,100% { filter: drop-shadow(0 0 18px rgba(255,255,255,.28)); opacity:.9; } 50% { filter: drop-shadow(0 0 38px rgba(255,255,255,.7)) drop-shadow(0 0 90px rgba(144,255,244,.22)); opacity:1; } }
    @keyframes reveal { from { opacity: 0; transform: translateY(32px) scale(.97); filter: blur(12px); } to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); } }

    .success-card {
      position: relative;
      z-index: 1;
      width: min(100% - 2rem, 820px);
      min-height: 520px;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: clamp(1.8rem, 7vw, 4rem);
      border: 1px solid rgba(255,255,255,.22);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.035)), rgba(0,0,0,.76);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 40px 160px rgba(0,0,0,.75), 0 0 120px rgba(144,255,244,.1);
      text-align: center;
      animation: reveal .9s cubic-bezier(.18,.9,.2,1) both;
    }

    .success-card::before {
      content: "";
      position: absolute;
      width: min(72vw, 520px);
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, #000 0 10%, rgba(255,255,255,.48) 11%, rgba(255,255,255,.12) 20%, transparent 45%),
        conic-gradient(from 0deg, transparent, rgba(255,255,255,.5), transparent, rgba(144,255,244,.24), transparent);
      box-shadow: 0 0 90px rgba(255,255,255,.2), inset 0 0 60px rgba(255,255,255,.08);
      animation: orbitalSpin 15s linear infinite, pulseGlow 4.4s ease-in-out infinite;
      opacity: .72;
    }

    .content {
      position: relative;
      z-index: 1;
      display: grid;
      justify-items: center;
      gap: 1rem;
    }

    .logo {
      width: min(420px, 78vw);
      filter: drop-shadow(0 0 28px rgba(255,255,255,.42));
    }

    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 760px;
      font-size: clamp(2.6rem, 9vw, 7rem);
      line-height: .88;
      letter-spacing: -.08em;
      text-transform: uppercase;
      text-shadow: 0 0 24px rgba(255,255,255,.38), 0 0 80px rgba(144,255,244,.16);
    }

    p {
      max-width: 540px;
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      margin-top: 1rem;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 999px;
      background: #fff;
      color: #000;
      padding: .95rem 1.25rem;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: .08em;
      text-decoration: none;
      transition: transform .25s ease, box-shadow .25s ease;
    }

    a:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 60px rgba(255,255,255,.22);
    }
  </style>
</head>
<body>
  <canvas id="space-canvas" aria-hidden="true"></canvas>
  <main class="success-card">
    <div class="content">
      <img class="logo" src="assets/logo.svg" alt="LATTICCE" />
      <p class="eyebrow">Portal privado</p>
      <h1>Inicio de sesión exitoso</h1>
      <p>Bienvenido, Daniel. El núcleo privado de LATTICCE está listo.</p>
      <a href="index.html">Volver al sitio</a>
    </div>
  </main>

  <script>
    if (sessionStorage.getItem('latticce-auth') !== 'Daniel') {
      window.location.replace('index.html');
    }

    const canvas = document.querySelector('#space-canvas');
    const ctx = canvas.getContext('2d');
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let stars = [];

    function resizeSpace() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const count = Math.min(150, Math.floor((window.innerWidth * window.innerHeight) / 7800));
      stars = Array.from({ length: count }, () => ({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.8 + .35,
        vx: (Math.random() - .5) * .18,
        vy: (Math.random() - .5) * .18,
        a: Math.random() * .55 + .18,
        pulse: Math.random() * Math.PI * 2
      }));
    }

    function drawSpace() {
      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      stars.forEach((s) => {
        s.x += s.vx;
        s.y += s.vy;
        s.pulse += .018;
        if (s.x < -10) s.x = window.innerWidth + 10;
        if (s.x > window.innerWidth + 10) s.x = -10;
        if (s.y < -10) s.y = window.innerHeight + 10;
        if (s.y > window.innerHeight + 10) s.y = -10;
        const alpha = s.a + Math.sin(s.pulse) * .18;
        ctx.beginPath();
        ctx.fillStyle = 'rgba(255,255,255,' + Math.max(.08, alpha) + ')';
        ctx.shadowColor = 'rgba(144,255,244,.45)';
        ctx.shadowBlur = 10;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      if (!prefersReduced) requestAnimationFrame(drawSpace);
    }

    resizeSpace();
    if (!prefersReduced) drawSpace();
    window.addEventListener('resize', resizeSpace);
  </script>
</body>
</html>
